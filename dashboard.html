<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#0d47a1;
color:white;
padding:20px;
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

.card h3{
margin-bottom:10px;
color:#555;
}

.number{
font-size:40px;
font-weight:bold;
color:#0d47a1;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.menu-btn{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
border-radius:10px;
cursor:pointer;
font-size:18px;
font-weight:bold;
}

.menu-btn:hover{
background:#1565c0;
}

.logout{
float:right;
background:red;
padding:10px 15px;
border-radius:5px;
font-size:14px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

Attendance Dashboard

<span class="logout" onclick="logout()">
Logout
</span>

</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Employees</h3>
<div class="number">1</div>
</div>

<div class="card">
<h3>Total Drivers</h3>
<div class="number">1</div>
</div>

<div class="card">
<h3>Present Today</h3>
<div class="number">1</div>
</div>

<div class="card">
<h3>Active Trips</h3>
<div class="number">1</div>
</div>

</div>

<div class="menu">

<div class="menu-btn">
Employees
</div>

<div class="menu-btn">
Drivers
</div>

<div class="menu-btn">
Attendance
</div>

<div class="menu-btn">
Trips
</div>

<div class="menu-btn">
Payroll
</div>

<div class="menu-btn">
Reports
</div>

</div>

</div>

<script>

function logout(){
window.location.href="index.html";
}

</script>

</body>
</html>
